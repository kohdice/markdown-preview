version: 2
builds:
  - id: markdown-preview
    builder: zig
    binary: mp
    targets:
      - x86_64-linux
      - aarch64-macos
    flags:
      - -Doptimize=ReleaseSafe
archives:
  - formats:
      - tar.gz
changelog:
  filters:
    exclude:
      - "^docs(\\(.+\\))?!?:"
      - "^test(\\(.+\\))?!?:"
release:
  draft: true
